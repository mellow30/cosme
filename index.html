<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>何歳になっても、可愛くなりたい。| 30代からのコスメ比較</title>
<meta name="description" content="デパコスもプチプラも、肌質別に比べて選べるコスメ比較ページ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6F7;--ink:#4A2B3A;--sub:#6B4A58;--pink:#9E2F57;--pink-d:#7A2142;--line:#F3D6DD;--tint:#FFE3EA;--accent:#C23B65}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic',sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--pink)}a:hover{color:var(--pink-d)}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.page{padding-bottom:64px;overflow:hidden}
.hero{position:relative;max-width:1040px;margin:0 auto;padding:44px 20px 36px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.flower{position:absolute}
.pill{position:relative;margin:0;padding:6px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--pink);font-size:14px;font-weight:700}
h1{position:relative;margin:0;font-family:'Kiwi Maru','Zen Maru Gothic',serif;font-size:clamp(32px,7vw,56px);line-height:1.45;font-weight:500;text-wrap:balance}
h1 span{color:var(--pink)}
.lead{position:relative;margin:0;max-width:520px;font-size:16px;line-height:1.8;color:var(--sub)}
.chips{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding-top:8px}
.chip{width:112px;height:112px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.chip p{margin:0;font-size:13px;font-weight:700;line-height:1.4}
main{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:24px}
.panel h2{margin:0;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Kiwi Maru','Zen Maru Gothic',serif;font-size:22px;font-weight:500}
.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:center;gap:10px}
.group-head span{width:36px;height:36px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center}
.group-head p{margin:0;font-size:16px;font-weight:700}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-height:44px;padding:10px 20px;border-radius:999px;font-size:15px;font-weight:700;background:#fff;color:var(--ink);border:2px solid #F0CBD5}
.opt.big{flex:1 1 200px;min-height:64px;padding:10px 18px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px}
.opt.mid{flex:1 1 100px;min-height:52px;padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px}
.opt small{font-size:13px;font-weight:500}
.opt[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.rank-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:12px}
.rank-head h2{margin:0;font-family:'Kiwi Maru','Zen Maru Gothic',serif;font-size:28px;font-weight:500}
.rank-head .sum{margin:0;font-size:15px;font-weight:700;color:var(--pink)}
.rank-head .note{margin:0;font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.photo{position:relative;height:170px;border-radius:16px;background:#FCE4EA;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;padding:5px 14px 5px 10px;border-radius:999px;font-size:15px;font-weight:700}
.r1{background:#FFF1C9;color:#7A5600}.r2{background:#ECECF2;color:#4A4A5A}.r3{background:#FBE3D3;color:#8A4A22}
.card h3{margin:0;font-size:17px;font-weight:700}
.meta{margin:4px 0 0;font-size:13px;color:var(--sub)}
.stars{display:flex;align-items:center;gap:8px}
.stars .s{font-size:18px;letter-spacing:2px;color:#B8860B}
.stars .n{font-size:13px;color:var(--sub)}
.checks{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--bg)}
.checks p{margin:0;display:flex;align-items:center;gap:8px;font-size:14px}
.priceRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{margin:0;font-size:22px;font-weight:700;color:var(--pink)}
.pt{margin:0;padding:4px 12px;border-radius:999px;background:var(--tint);color:var(--pink-d);font-size:13px;font-weight:700}
.buy{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;text-decoration:none}
.buy:hover{color:#fff;opacity:.92}
.guide{position:relative;overflow:hidden;margin-top:8px;padding:22px 26px;border-radius:24px;background:var(--tint);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--ink);text-decoration:none}
.guide:hover{color:var(--ink)}
.guide .t{position:relative;display:flex;flex-direction:column;gap:4px}
.guide .t b{font-size:14px;color:var(--pink-d)}
.guide .t span{font-family:'Kiwi Maru','Zen Maru Gothic',serif;font-size:22px}
.pr{padding:20px 24px;border-radius:20px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pr p{margin:0;font-size:13px;line-height:1.8;color:var(--sub)}
</style>
</head>
<body>
<div class="page">

<header class="hero">
<svg class="flower" aria-hidden="true" width="150" height="150" viewBox="0 0 100 100" style="top:-30px;left:-40px"><g fill="#FCD3DD"><circle cx="50" cy="22" r="18"/><circle cx="76" cy="41" r="18"/><circle cx="66" cy="72" r="18"/><circle cx="34" cy="72" r="18"/><circle cx="24" cy="41" r="18"/></g><circle cx="50" cy="50" r="10" fill="#F7A8BC"/></svg>
<svg class="flower" aria-hidden="true" width="110" height="110" viewBox="0 0 100 100" style="top:70px;right:-30px"><g fill="#FFE3EA"><circle cx="50" cy="22" r="18"/><circle cx="76" cy="41" r="18"/><circle cx="66" cy="72" r="18"/><circle cx="34" cy="72" r="18"/><circle cx="24" cy="41" r="18"/></g><circle cx="50" cy="50" r="10" fill="#F7A8BC"/></svg>
<svg class="flower" aria-hidden="true" width="52" height="52" viewBox="0 0 100 100" style="bottom:150px;left:22px"><g fill="#FFE3EA"><circle cx="50" cy="22" r="18"/><circle cx="76" cy="41" r="18"/><circle cx="66" cy="72" r="18"/><circle cx="34" cy="72" r="18"/><circle cx="24" cy="41" r="18"/></g><circle cx="50" cy="50" r="10" fill="#F7A8BC"/></svg>
<p class="pill">30代からのコスメ比較</p>
<h1>何歳になっても、<br><span>可愛くなりたい。</span></h1>
<p class="lead">デパコスもプチプラも、肌質別に比べて選べる。いまの自分にちょうどいいコスメが見つかります。</p>
<div class="chips">
<div class="chip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg><p>人気コスメを<br>比較</p></div>
<div class="chip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M6 20h12M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0L5 7z"/><path d="M19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg><p>価格・ポイント<br>がわかる</p></div>
<div class="chip"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg><p>肌質で<br>選べる</p></div>
</div>
</header>

<main>
<section class="panel" aria-label="かんたん検索">
<h2>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
<span>かんたん検索</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
</h2>

<div class="group">
<div class="group-head"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg></span><p>価格帯で探す</p></div>
<div class="opts" id="tiers"></div>
</div>

<div class="group">
<div class="group-head"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v3H9z"/><path d="M8 6h8v3l1 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8l1-2V6z"/><path d="M10 14h4"/></svg></span><p>カテゴリで探す</p></div>
<div class="opts" id="cats"></div>
</div>

<div class="group">
<div class="group-head"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></span><p>肌質で探す</p></div>
<div class="opts" id="skins"></div>
</div>
</section>

<section aria-label="人気ランキング">
<div class="rank-head">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>
<h2>人気ランキング</h2>
<p class="sum" id="summary"></p>
<p class="note">表示中の商品名・価格・評価はサンプルです</p>
</div>
<div class="grid" id="cards" style="margin-top:24px"></div>
</section>

<a class="guide" href="#">
<svg aria-hidden="true" width="120" height="120" viewBox="0 0 100 100" style="position:absolute;right:30px;top:-30px"><g fill="#FCD3DD"><circle cx="50" cy="22" r="18"/><circle cx="76" cy="41" r="18"/><circle cx="66" cy="72" r="18"/><circle cx="34" cy="72" r="18"/><circle cx="24" cy="41" r="18"/></g><circle cx="50" cy="50" r="10" fill="#F7A8BC"/></svg>
<span class="t"><b>初めての方へ</b><span>このサイトの使い方</span></span>
<svg style="position:relative" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A2142" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>

<div class="pr">
<p>【PR】当ページは広告(アフィリエイトリンク)を含みます。</p>
<p>価格・ポイント倍率・評価は変動します。購入前に楽天市場のページでご確認ください。感じ方には個人差があります。</p>
</div>
</main>
</div>

<script>
(function () {
  var tiers = [
    { id: 'dept', label: 'デパコス', sub: '3,000円以上', check: 'ごほうびに選びたい' },
    { id: 'plp', label: 'プチプラ', sub: '3,000円未満', check: 'コスパ重視で選びたい' }
  ];
  var cats = [
    { id: 'skin', label: 'スキンケア' },
    { id: 'base', label: 'ベースメイク' },
    { id: 'point', label: 'ポイントメイク' },
    { id: 'hair', label: 'ヘアケア' },
    { id: 'body', label: 'ボディケア' }
  ];
  var skins = [
    { id: 'dry', label: '乾燥肌', sub: 'うるおい重視', check: 'うるおいを重視したい' },
    { id: 'combo', label: '混合肌', sub: 'バランス重視', check: 'バランスよく選びたい' },
    { id: 'oily', label: '脂性肌', sub: 'さっぱり重視', check: 'さっぱり使いたい' }
  ];
  var state = { tier: 'dept', cat: 'skin', skin: 'dry' };

  var CROWN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>';
  var BOTTLE = '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v3H9z"/><path d="M8 6h8v3l1 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8l1-2V6z"/><path d="M10 14h4"/></svg>';
  var CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9E2F57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  var CART = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>';

  function find(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return list[0];
  }

  function optButtons(list, key, cls, withSub) {
    return list.map(function (o) {
      var pressed = state[key] === o.id ? 'true' : 'false';
      var inner = withSub ? '<span>' + o.label + '</span><small>' + o.sub + '</small>' : o.label;
      return '<button type="button" class="opt ' + cls + '" data-key="' + key + '" data-id="' + o.id + '" aria-pressed="' + pressed + '">' + inner + '</button>';
    }).join('');
  }

  function render() {
    var tier = find(tiers, state.tier);
    var cat = find(cats, state.cat);
    var skin = find(skins, state.skin);

    document.getElementById('tiers').innerHTML = optButtons(tiers, 'tier', 'big', true);
    document.getElementById('cats').innerHTML = optButtons(cats, 'cat', '', false);
    document.getElementById('skins').innerHTML = optButtons(skins, 'skin', 'mid', true);
    document.getElementById('summary').textContent = tier.label + ' × ' + cat.label + ' × ' + skin.label;

    var prices = state.tier === 'dept' ? ['¥6,600', '¥4,950', '¥3,300'] : ['¥1,980', '¥1,320', '¥880'];
    var pts = ['ポイント15倍', 'ポイント10倍', 'ポイント5倍'];
    var stars = ['★★★★★', '★★★★☆', '★★★★☆'];
    var starLabels = ['評価5', '評価4', '評価4'];
    var reviews = ['レビュー 1,200件', 'レビュー 860件', 'レビュー 540件'];

    var html = '';
    for (var i = 0; i < 3; i++) {
      html += '<article class="card">' +
        '<div class="photo"><span class="badge r' + (i + 1) + '">' + CROWN + '<span>' + (i + 1) + '位</span></span>' + BOTTLE + '</div>' +
        '<div><h3>商品名が入ります</h3><p class="meta">' + cat.label + ' / ' + skin.label + 'さん向け</p></div>' +
        '<div class="stars"><span class="s" role="img" aria-label="' + starLabels[i] + '">' + stars[i] + '</span><span class="n">' + reviews[i] + '</span></div>' +
        '<div class="checks"><p>' + CHECK + '<span>' + skin.check + '</span></p><p>' + CHECK + '<span>' + tier.check + '</span></p></div>' +
        '<div class="priceRow"><p class="price">' + prices[i] + '</p><p class="pt">' + pts[i] + '</p></div>' +
        '<a class="buy" href="#">' + CART + '<span>楽天市場で見る</span></a>' +
        '</article>';
    }
    document.getElementById('cards').innerHTML = html;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('button[data-key]') : null;
    if (!el) return;
    state[el.getAttribute('data-key')] = el.getAttribute('data-id');
    render();
  });

  render();
})();
</script>
</body>
</html>
